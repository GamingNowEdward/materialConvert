name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    # Cover Windows path behaviour as well: the tool is distributed to Maya
    # users on Windows, where separators, case-insensitivity and encoding
    # differ from the Linux runner.  PySide2 (Maya 2024) differences are covered
    # by the local mayapy suite, which cannot run in CI.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Qt system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 libglib2.0-0 libxrender1 libxi6
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -v --timeout=120
      - name: Guard against silent logging
        run: python scripts/check_no_silent_pass.py
